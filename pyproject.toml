[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openai-agents-agentsearch"
version = "0.2.1"
description = "OpenAI Agents SDK function tools for AgentSearch: free live web search, plus pay-per-call extract and JS render"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["openai-agents>=0.2", "httpx>=0.25", "pydantic>=2"]
keywords = ["openai-agents", "openai", "agentsearch", "web-search", "tools", "agents", "x402"]

[project.optional-dependencies]
paid = ["x402[evm]>=2.0"]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/agentsearchhq-coder/openai-agents-agentsearch"
Issues = "https://github.com/agentsearchhq-coder/openai-agents-agentsearch/issues"
Homepage = "https://agentsearchhq.com/?utm_source=openai-agents-agentsearch&utm_medium=package"
Documentation = "https://agentsearchhq.com/agents.md?utm_source=openai-agents-agentsearch&utm_medium=package"

[tool.hatch.build.targets.wheel]
packages = ["openai_agents_agentsearch"]

[tool.hatch.build.targets.sdist]
include = ["openai_agents_agentsearch", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

